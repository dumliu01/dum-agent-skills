version: 2

project:
  name: "<project>"
  e2e_root: "<detected-existing-path>"
  entrypoint: "<existing-runner-or-test-entry>"
  toolchain:
    flutter_authority: ".fvmrc"
    expected_flutter: "<version>"
    expected_dart: "<version>"
    verify_package_config_sdk: true
    no_pub_during_test: true
    protect_lockfiles: ["pubspec.lock"]
    node: "<version-if-needed>"

selection:
  scope: "all" # all | module | modules | file | case
  modules: []
  files: []
  cases: []
  fail_on_empty: true

run:
  run_id_prefix: "e2e"
  batch_reuse: true
  device_lease: true
  workspace_build_lease: true
  single_e2e_command_per_workspace: true
  preserve_first_failure: true
  fail_on_post_test_async_error: true
  fail_on_cleanup_residual: true
  artifact_root: "<artifacts/e2e>"

timeouts:
  preflight_seconds: 60
  build_seconds: 900
  install_seconds: 300
  login_seconds: 120
  ready_seconds: 120
  business_step_seconds: 60
  external_event_seconds: 180
  coordination_seconds: 120
  cleanup_seconds: 120

services:
  hard:
    - name: "<business-api>"
      health_url: "<url>"
  soft:
    - name: "<non-blocking-service>"
      health_url: "<url>"
      on_failure: "record-noise"
  optional: []

actors:
  A:
    account_env: "E2E_ACTOR_A_ACCOUNT"
    password_env: "E2E_ACTOR_A_PASSWORD"
    expected_roles: ["<role>"]
    required_capabilities: ["<capability>"]
    device:
      platform: "macos"
      id: "<exact-device-id>"
      timezone: "Asia/Shanghai"
  B:
    enabled: false
    account_env: "E2E_ACTOR_B_ACCOUNT"
    password_env: "E2E_ACTOR_B_PASSWORD"
    expected_roles: ["<role>"]
    required_capabilities: ["<capability>"]
    device:
      platform: "ios"
      id: "<exact-simulator-or-device-id>"
      timezone: "America/Los_Angeles"

external_capabilities:
  - name: "<capability>"
    dependency: "hard" # hard | soft | optional
    required_secret_envs: []
    missing: "fail" # fail | skip | degrade

fixtures:
  validate_against_production_code:
    id_format: true
    resource_existence: true
    membership: true
    purpose: true
    forbid_invented_ids: true
  persistent:
    - name: "<organization-or-group>"
      resolve_by: "<stable-semantic-name>"
      verify: true
      bootstrap_if_missing: true
      delete_after_run: false
      restore_after_run: true
  suite: []
  ephemeral:
    naming: "<resource>-{runId}-{caseId}"
    register_before_first_act: true
    cleanup_by_exact_id: true
    residual_audit_by_run_id: true

coordination:
  enabled: false
  event_key: ["runId", "batchId", "caseId", "actor", "stage"]
  propagate_peer_failure: true
  cleanup_barrier:
    - "cleanup_requested"
    - "peer_ready"
    - "cleanup_completed"
    - "peer_settled"

rerun_matrix:
  clean_run: true
  dirty_rerun: true
  failure_rerun: true
  module_composition_after_file: true

flutter_preflight:
  startup_lock: true
  xcode_build_db: true
  active_flutter_test_process: true
  active_xcodebuild_process: true
  responsive_navigation: true

progress:
  stages: ["resolve", "build", "install", "login", "ready", "case", "tc", "step", "cleanup"]
  heartbeat: true
  include_source_file: true
  include_actor_stage: true

evidence:
  screenshot: true
  ui_tree: true
  client_logs: true
  api_summary: true
  actor_logs: true
  coordinator_events: true
  build_install_logs: true
  cleanup_audit: true
  redact_headers: ["Authorization", "Cookie", "Set-Cookie"]
